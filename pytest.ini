[pytest]
# Tests live in tests/, and they import the project's folders (config, sources, checks, agents) from the project root
testpaths = tests
pythonpath = .

# Tests marked "openai" call the real OpenAI API, so they cost a little money
markers =
    openai: calls the real OpenAI API. Run these on purpose with: python -m pytest -m openai

# A plain "python -m pytest" only runs the free tests. Writing -m on the command line replaces this choice
addopts = -m "not openai"
